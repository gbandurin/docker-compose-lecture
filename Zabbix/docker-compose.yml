services:
  postgres:
    image: postgres:16-alpine
    container_name: zabbix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: change_this_password
      POSTGRES_DB: zabbix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 10s
      timeout: 5s
      retries: 10

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.4-latest
    container_name: zabbix-server
    restart: unless-stopped
    user: root # для реальных стендов не используйте - создайте пользователя zabbix и добавьте его в группу docker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: change_this_password
      POSTGRES_DB: zabbix
    extra_hosts:
    - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "10051:10051"

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4-latest
    container_name: zabbix-web
    restart: unless-stopped
    depends_on:
      - zabbix-server
      - postgres
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: change_this_password
      POSTGRES_DB: zabbix
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: UTC
    ports:
      - "8080:8080"

  zabbix-agent2:
    container_name: zabbix-agent2
    image: zabbix/zabbix-agent2:latest
    environment:
      ZBX_HOSTNAME: zabbix-agent2
      ZBX_SERVER_HOST: 172.18.0.1
      ZBX_SERVER_PORT: 10051
    user: root # для реальных стендов не используйте - создайте пользователя zabbix и добавьте его в группу docker
    ports:
      - "10050:10050"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API + Web UI
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
      - ./snapshots:/qdrant/snapshots
    environment:
      QDRANT__LOG_LEVEL: INFO
      QDRANT__SERVICE__ENABLE_TLS: "true"
      QDRANT__TLS__CERT: /qdrant/tls/cert.pem
      QDRANT__TLS__KEY: /qdrant/tls/key.pem
      QDRANT__SERVICE__API_KEY: "my-admin-key"
      #QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/zz_snapshot
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    # Не работает - нет curl вконтейнере
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -o /dev/null http://localhost:6333/healthz || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s


volumes:
  postgres_data:
  qdrant_data:
